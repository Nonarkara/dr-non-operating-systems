services:
  - type: web
    name: dr-non-operating-systems
    runtime: node
    buildCommand: echo "No build step"
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: ADMIN_BEARER_TOKEN
        sync: false
      - key: ALERT_WEBHOOK_URL
        sync: false
    pullRequestPreviewsEnabled: false
