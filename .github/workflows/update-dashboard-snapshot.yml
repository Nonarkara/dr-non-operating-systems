name: Update Dashboard Snapshot

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */2 * * *"

permissions:
  contents: write

concurrency:
  group: dashboard-snapshot
  cancel-in-progress: true

jobs:
  snapshot:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate dashboard snapshot
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          npm run snapshot

      - name: Commit snapshot and data files if changed
        run: |
          git add \
            public/data/dashboard-snapshot.json \
            public/data/health-history.json \
            public/data/analytics.json \
            public/data/alerts.json \
            public/data/triggers.json

          if git diff --cached --quiet; then
            echo "No data changes detected."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update dashboard snapshot and monitoring data"
          git push
