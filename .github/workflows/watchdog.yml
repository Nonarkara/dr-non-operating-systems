name: Watchdog — Auto-restart failing services

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

concurrency:
  group: watchdog
  cancel-in-progress: true

jobs:
  watchdog:
    runs-on: ubuntu-latest

    steps:
      - name: Poll triggers and health
        id: check
        env:
          ADMIN_BEARER_TOKEN: ${{ secrets.ADMIN_BEARER_TOKEN }}
        run: |
          OPS_URL="https://dr-non-operating-systems.onrender.com"

          echo "=== Checking health ==="
          HEALTH=$(curl -sf "$OPS_URL/api/health" || echo '{"status":"unreachable"}')
          echo "$HEALTH" | jq .
          STATUS=$(echo "$HEALTH" | jq -r '.status // "unreachable"')
          ATTENTION=$(echo "$HEALTH" | jq -r '.summary.attentionCount // 0')
          INCIDENTS=$(echo "$HEALTH" | jq -r '.activeIncidents // 0')
          LAST_SCAN=$(curl -sf "$OPS_URL/api/admin/scheduler" -H "Authorization: Bearer $ADMIN_BEARER_TOKEN" | jq -r '.lastSuccessfulScanAt // "unknown"' || echo "unknown")
          echo "status=$STATUS" >> "$GITHUB_OUTPUT"
          echo "attention=$ATTENTION" >> "$GITHUB_OUTPUT"
          echo "incidents=$INCIDENTS" >> "$GITHUB_OUTPUT"
          echo "last_scan=$LAST_SCAN" >> "$GITHUB_OUTPUT"

          echo "=== Checking triggers ==="
          TRIGGERS=$(curl -sf "$OPS_URL/api/triggers?status=open" || echo '{"triggers":[]}')
          TRIGGER_COUNT=$(echo "$TRIGGERS" | jq '.triggers | length')
          echo "trigger_count=$TRIGGER_COUNT" >> "$GITHUB_OUTPUT"
          echo "triggers=$TRIGGERS" >> "$GITHUB_OUTPUT"
          echo "Found $TRIGGER_COUNT open triggers"

          if [ "$TRIGGER_COUNT" -gt 0 ]; then
            echo "$TRIGGERS" | jq -r '.triggers[] | "  - \(.targetLabel): \(.context.error // "unknown")"'
          fi

      - name: Restart Render services with open triggers
        if: steps.check.outputs.trigger_count != '0' && env.RENDER_API_KEY != ''
        env:
          ADMIN_BEARER_TOKEN: ${{ secrets.ADMIN_BEARER_TOKEN }}
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          OPS_URL: https://dr-non-operating-systems.onrender.com
        run: |
          # Map target IDs to Render service names for restart
          # These are the Render-hosted services
          declare -A RENDER_SERVICES=(
            ["middle-east-monitor"]="middle-east-monitor"
            ["geopolitics-dashboard"]="geopolitics-dashboard"
            ["city-reporter-bot"]="city-reporter-bot"
            ["city-reporter-bot-v2"]="city-reporter-line-bot"
            ["smart-city-monitor"]="smart-city-monitor-web"
            ["mtt-smart-city-monitor"]="mtt-smart-city-monitor-web"
            ["phuket-smart-bus"]="phuket-smart-bus-y6tj"
            ["tech-monitor"]="tech-monitor"
            ["slic-index-rankings"]="slic-index"
            ["slic-index-v2"]="slic-index-v2"
            ["airdnd-platform"]="airdnd-platform"
            ["phuket-dashboard"]="phuket-dashboard"
          )

          TRIGGERS='${{ steps.check.outputs.triggers }}'

          echo "$TRIGGERS" | jq -c '.triggers[]' | while read -r trigger; do
            TARGET_ID=$(echo "$trigger" | jq -r '.targetId')
            TRIGGER_ID=$(echo "$trigger" | jq -r '.id')
            TARGET_LABEL=$(echo "$trigger" | jq -r '.targetLabel')
            PLATFORM=$(echo "$trigger" | jq -r '.context.platform // ""')

            echo "--- Processing trigger for: $TARGET_LABEL ($TARGET_ID) ---"

            # Claim the trigger
            curl -sf -X POST "$OPS_URL/api/admin/triggers/$TRIGGER_ID/claim" \
              -H "Authorization: Bearer $ADMIN_BEARER_TOKEN" \
              -H 'Content-Type: application/json' \
              -d '{"claimedBy":"github-actions-watchdog"}' > /dev/null 2>&1 || true

            # Only attempt restart for Render services
            if [ "$PLATFORM" != "Render" ]; then
              echo "  Skipping: $TARGET_LABEL is on $PLATFORM (not Render)"
              curl -sf -X POST "$OPS_URL/api/admin/triggers/$TRIGGER_ID/resolve" \
                -H "Authorization: Bearer $ADMIN_BEARER_TOKEN" \
                -H 'Content-Type: application/json' \
                -d "{\"resolution\":\"Skipped auto-restart: $PLATFORM platform not supported for automated restarts\"}" > /dev/null 2>&1 || true
              continue
            fi

            SERVICE_NAME="${RENDER_SERVICES[$TARGET_ID]}"
            if [ -z "$SERVICE_NAME" ]; then
              echo "  Skipping: No Render service mapping for $TARGET_ID"
              curl -sf -X POST "$OPS_URL/api/admin/triggers/$TRIGGER_ID/resolve" \
                -H "Authorization: Bearer $ADMIN_BEARER_TOKEN" \
                -H 'Content-Type: application/json' \
                -d '{"resolution":"No Render service mapping found for automated restart"}' > /dev/null 2>&1 || true
              continue
            fi

            echo "  Looking up Render service: $SERVICE_NAME"

            # Find the service ID via Render API
            SERVICE_ID=$(curl -sf "https://api.render.com/v1/services?name=$SERVICE_NAME&limit=1" \
              -H "Authorization: Bearer $RENDER_API_KEY" | jq -r '.[0].service.id // empty')

            if [ -z "$SERVICE_ID" ]; then
              echo "  Could not find Render service ID for $SERVICE_NAME"
              curl -sf -X POST "$OPS_URL/api/admin/triggers/$TRIGGER_ID/resolve" \
                -H "Authorization: Bearer $ADMIN_BEARER_TOKEN" \
                -H 'Content-Type: application/json' \
                -d "{\"resolution\":\"Could not find Render service ID for $SERVICE_NAME\"}" > /dev/null 2>&1 || true
              continue
            fi

            echo "  Restarting service $SERVICE_NAME ($SERVICE_ID)"
            RESTART_RESULT=$(curl -sf -X POST "https://api.render.com/v1/services/$SERVICE_ID/restart" \
              -H "Authorization: Bearer $RENDER_API_KEY" 2>&1) || true

            echo "  Restart issued. Waiting 30s to verify..."
            sleep 30

            # Verify the service is back
            SERVICE_URL=$(echo "$trigger" | jq -r '.context.url')
            HTTP_CODE=$(curl -sf -o /dev/null -w '%{http_code}' --max-time 15 "$SERVICE_URL" 2>/dev/null || echo "000")

            if [ "$HTTP_CODE" = "200" ]; then
              RESOLUTION="Auto-restarted Render service $SERVICE_NAME. Service recovered (HTTP $HTTP_CODE)."
              echo "  SUCCESS: $RESOLUTION"
            else
              RESOLUTION="Auto-restarted Render service $SERVICE_NAME but service still returning HTTP $HTTP_CODE. Manual investigation needed."
              echo "  PARTIAL: $RESOLUTION"
            fi

            # Resolve the trigger
            curl -sf -X POST "$OPS_URL/api/admin/triggers/$TRIGGER_ID/resolve" \
              -H "Authorization: Bearer $ADMIN_BEARER_TOKEN" \
              -H 'Content-Type: application/json' \
              -d "{\"resolution\":\"$RESOLUTION\"}" > /dev/null 2>&1 || true

          done

      - name: Create issue for persistent failures
        if: steps.check.outputs.trigger_count != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TRIGGERS='${{ steps.check.outputs.triggers }}'
          TRIGGER_COUNT='${{ steps.check.outputs.trigger_count }}'
          ATTENTION='${{ steps.check.outputs.attention }}'

          # Only create an issue if there are actual triggers (not just attention items)
          if [ "$TRIGGER_COUNT" -eq 0 ]; then
            echo "No triggers to report"
            exit 0
          fi

          BODY="## Watchdog Alert\n\n"
          BODY+="**Time:** $(date -u +%Y-%m-%dT%H:%M:%SZ)\n"
          BODY+="**Open triggers:** $TRIGGER_COUNT\n"
          BODY+="**Targets needing attention:** $ATTENTION\n\n"
          BODY+="### Triggered Systems\n\n"

          echo "$TRIGGERS" | jq -r '.triggers[] | "- **\(.targetLabel)** (\(.context.platform // "unknown")): \(.context.error // "unknown error")"' | while read -r line; do
            BODY+="$line\n"
          done

          BODY+="\n---\n*Auto-generated by the watchdog workflow*"

          # Check if there's already an open watchdog issue
          EXISTING=$(gh issue list --repo "$GITHUB_REPOSITORY" --label "watchdog" --state open --limit 1 --json number --jq '.[0].number // empty' 2>/dev/null || true)

          if [ -n "$EXISTING" ]; then
            echo "Updating existing issue #$EXISTING"
            printf "$BODY" | gh issue comment "$EXISTING" --repo "$GITHUB_REPOSITORY" --body-file - 2>/dev/null || true
          else
            echo "Creating new watchdog issue"
            printf "$BODY" | gh issue create --repo "$GITHUB_REPOSITORY" \
              --title "Watchdog: $TRIGGER_COUNT system(s) triggered auto-debug" \
              --label "watchdog" \
              --body-file - 2>/dev/null || true
          fi

      - name: Summary
        run: |
          echo "### Watchdog Report" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Metric | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|--------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Status | ${{ steps.check.outputs.status }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Attention items | ${{ steps.check.outputs.attention }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Active incidents | ${{ steps.check.outputs.incidents }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Last successful scan | ${{ steps.check.outputs.last_scan }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Open triggers | ${{ steps.check.outputs.trigger_count }} |" >> "$GITHUB_STEP_SUMMARY"
