name: Watchdog — Direct URL health checks

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

concurrency:
  group: watchdog
  cancel-in-progress: true

jobs:
  watchdog:
    runs-on: ubuntu-latest

    steps:
      - name: Check all target URLs
        id: check
        run: |
          # Direct URL checks — no Render dashboard dependency
          declare -A TARGETS=(
            ["War Monitor"]="https://nonarkara.github.io/middleeast-monitor/"
            ["MEM by NON"]="https://nonarkara.github.io/mem-by-non/"
            ["SLIC Index 2026"]="https://nonarkara.github.io/slic-index-V2/"
            ["Sabai Sabai"]="https://sabai-sabai-4uh.pages.dev"
            ["City Tech Atlas"]="https://citytechatlas.lovable.app"
            ["SCL Landing Page"]="https://nonarkara.github.io/scl-landing-page/"
            ["RAAT"]="https://nonarkara.github.io/RAAT/index.html?lang=en"
            ["Tech Hunt Thailand"]="https://nonarkara.github.io/techhuntthailand/?id=mobility-cohort-001-viabus"
            ["ASCN Smart Cities"]="https://nonarkara.github.io/ascn-smart-cities-network/"
            ["ASEAN CSCO App"]="https://nonarkara.github.io/asean-csco-app/#manifesto"
            ["Kuching IOC"]="https://nonarkara.github.io/kuching-ioc/"
          )

          FAILURES=0
          FAILURE_LIST=""

          for LABEL in "${!TARGETS[@]}"; do
            URL="${TARGETS[$LABEL]}"
            HTTP_CODE=$(curl -sf -o /dev/null -w '%{http_code}' --max-time 15 "$URL" 2>/dev/null || echo "000")

            if [ "$HTTP_CODE" = "200" ]; then
              echo "  OK: $LABEL ($HTTP_CODE)"
            else
              echo "  FAIL: $LABEL ($HTTP_CODE) — $URL"
              FAILURES=$((FAILURES + 1))
              FAILURE_LIST="$FAILURE_LIST\n- **$LABEL**: HTTP $HTTP_CODE ($URL)"
            fi
          done

          echo "failures=$FAILURES" >> "$GITHUB_OUTPUT"
          echo "failure_list=$FAILURE_LIST" >> "$GITHUB_OUTPUT"
          echo ""
          echo "Total failures: $FAILURES / ${#TARGETS[@]}"

      - name: Create issue for failures
        if: steps.check.outputs.failures != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          FAILURES='${{ steps.check.outputs.failures }}'

          BODY="## Watchdog Alert\n\n"
          BODY+="**Time:** $(date -u +%Y-%m-%dT%H:%M:%SZ)\n"
          BODY+="**Failing targets:** $FAILURES\n\n"
          BODY+="### Failures\n"
          BODY+="${{ steps.check.outputs.failure_list }}\n"
          BODY+="\n---\n*Auto-generated by the watchdog workflow*"

          # Check if there's already an open watchdog issue
          EXISTING=$(gh issue list --repo "$GITHUB_REPOSITORY" --label "watchdog" --state open --limit 1 --json number --jq '.[0].number // empty' 2>/dev/null || true)

          if [ -n "$EXISTING" ]; then
            echo "Updating existing issue #$EXISTING"
            printf "$BODY" | gh issue comment "$EXISTING" --repo "$GITHUB_REPOSITORY" --body-file - 2>/dev/null || true
          else
            echo "Creating new watchdog issue"
            printf "$BODY" | gh issue create --repo "$GITHUB_REPOSITORY" \
              --title "Watchdog: $FAILURES target(s) failing health checks" \
              --label "watchdog" \
              --body-file - 2>/dev/null || true
          fi

      - name: Summary
        run: |
          echo "### Watchdog Report" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Metric | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|--------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Failures | ${{ steps.check.outputs.failures }} |" >> "$GITHUB_STEP_SUMMARY"
